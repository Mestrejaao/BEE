<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10121b">
  <title>GalTalk AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="logo">G</div>
      <div>
        <h1>GalTalk AI</h1>
        <p>Seu assistente inteligente</p>
      </div>
    </header>

    <section class="welcome">
      <h2>Olá! Como posso ajudar?</h2>
      <p>A GalTalk AI está sendo preparada.</p>
    </section>

    <section class="chat" id="chat">
      <div class="message assistant">
        Olá! Sou a GalTalk AI. Em breve estarei pronta para conversar com você.
      </div>
    </section>

    <form id="chat-form">
      <input
        id="message-input"
        type="text"
        placeholder="Digite uma mensagem..."
        autocomplete="off"
      >
      <button type="submit">Enviar</button>
    </form>

    <footer>GalTalk AI · Projeto pessoal</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
